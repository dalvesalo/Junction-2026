<!doctype html>
<html><head><meta charset="utf-8">
<!-- YouTube thumbnail 1280×720 (render: python3 thumb.py). Uses assets/st_matti.jpg from capture.py. -->
<style>
@font-face{font-family:'SS3';src:url(../../app/fonts/source-sans-3-latin-wght-normal.woff2);font-weight:200 900}
@font-face{font-family:'SS3';src:url(../../app/fonts/source-sans-3-latin-ext-wght-normal.woff2);font-weight:200 900;unicode-range:U+0100-024F}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#23395B;font-family:SS3,sans-serif;color:#fff}
.shot{position:absolute;left:660px;top:70px;width:580px;height:560px;overflow:hidden;border:2px solid #A8B3BE;box-shadow:0 20px 50px rgba(0,0,0,.45);background:#E9EDF1}
.shot img{position:absolute;width:1440px;left:-230px;top:-150px;transform-origin:0 0;transform:scale(0.9)}
.spot{position:absolute;outline:5px solid #D98E04;box-shadow:0 0 0 5px #fff}
.l{position:absolute;left:60px;top:0;bottom:0;width:570px;display:flex;flex-direction:column;justify-content:center}
.w{font-size:150px;font-weight:800;letter-spacing:-4px;line-height:.9}
.t{font-size:38px;font-weight:700;line-height:1.12;margin-top:30px}
.t span{color:#FFC861}
.s{font-size:25px;color:#D6E0EA;margin-top:22px;line-height:1.3}
.chip{position:absolute;left:64px;bottom:40px;font-size:20px;font-weight:700;letter-spacing:1.5px;color:#D6E0EA;text-transform:uppercase}
.tag{position:absolute;right:14px;bottom:14px;font-size:16px;font-weight:700;letter-spacing:1px;color:#A35F00;background:#FFF3D9;border:1px solid #E7C98C;padding:4px 8px}
</style></head><body>
<div class="shot"><img src="assets/st_matti.jpg"><div class="spot" id="sp"></div><div class="tag">SYNTHETIC PATIENT</div></div>
<div class="l">
  <div class="w">Ajoissa.</div>
  <div class="t">Same symptom, same speed —<br><span>whichever door you walk in.</span></div>
  <div class="s">A safety-net agent for Finland's public primary care</div>
</div>
<div class="chip">Junction 2026 · AstraZeneca challenge · Brainwave Bandits</div>
<script src="assets/boxes.js"></script>
<script>
// highlight the risk row (21.5 % vs 3 % threshold) on the screenshot
const b=BOXES.states.st_matti.thr, k=0.9, ox=-230, oy=-150;
const sp=document.getElementById('sp');
sp.style.left=(ox+(b[0]-4)*k)+'px'; sp.style.top=(oy+(b[1]+36)*k)+'px'; sp.style.width=((b[2]+8)*k)+'px'; sp.style.height=(98*k)+'px';
</script>
</body></html>
